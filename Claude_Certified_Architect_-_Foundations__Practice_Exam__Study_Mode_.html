igures included, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile before passing to synthesis.", "D": "Include both figures in the analysis output without flagging them as conflicting, allowing the synthesis agent to determine which to use based on the broader research context."}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 52, "scenario": "Multi-Agent Research System", "stem": "The document analysis subagent encounters a corrupted PDF file it cannot parse. When designing the system’s error handling, what is the most effective way to handle this failure?", "options": {"A": "Silently skip the corrupted document and continue processing other files to avoid interrupting the workflow.", "B": "Throw an exception that terminates the entire research workflow.", "C": "Return the error with context to the coordinator agent, letting it decide how to proceed.", "D": "Automatically retry parsing the document three times with exponential backoff before reporting failure."}, "correct": "C", "explanation_correct": "Returning the error with context to the coordinator agent is the most effective approach because it enables the coordinator to make an informed decision—such as skipping the file, trying an alternative parsing method, or notifying the user—while maintaining visibility into the failure.", "study_area": "Multi-Agent Research System — review Error Propagation concepts in the exam study guide.", "distractors": {"D": "Retrying with exponential backoff is a strategy suited for transient failures such as network timeouts, but file corruption is a permanent condition that will not resolve on its own, making repeated attempts wasteful and ineffective."}, "clipped": false}, {"q": 53, "scenario": "Multi-Agent Research System", "stem": "Production logs reveal a consistent pattern: requests to “analyze the quarterly report I uploaded” are routed to the web search agent 45% of the time instead of the document analysis agent. Examining the tool definitions, you find the web search agent has an `analyze_content` tool described as “analyzes content and extracts key information,” while the document analysis agent has an `analyze_document` tool described as “analyzes documents and extracts key information.” How should you address this misrouting?", "options": {"A": "Add a pre-routing classifier that determines whether the user is referencing uploaded files or web content before the coordinator makes delegation decisions.", "B": "Expand the document analysis tool’s description to include example use cases like “Use for uploaded PDFs, Word documents, and spreadsheets” while leaving the web search tool unchanged.", "C": "Rename the web search tool to `extract_web_results` and update its description to “processes and returns information retrieved from web searches and URLs.”", "D": "Add few-shot examples to the coordinator’s prompt showing correct routing: “User uploads quarterly report → document analysis agent” and “User asks about a webpage → web search agent.”"}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 54, "scenario": "Multi-Agent Research System", "stem": "The web search and document analysis agents have both completed their tasks and returned findings to the coordinator. What is the appropriate next step for producing an integrated research output?", "options": {"A": "The coordinator concatenates the raw outputs from both agents and returns them as the final result", "B": "The document analysis agent requests the web search results and merges them internally", "C": "The coordinator passes both sets of findings to the synthesis agent for unified integration", "D": "Each agent directly sends its findings to the report generation agent, bypassing the coordinator"}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 55, "scenario": "Multi-Agent Research System", "stem": "When researching a broad topic, you observe that the web search agent and document analysis agent are both investigating the same subtopics, resulting in significant overlap in their findings. Token usage has nearly doubled without proportionally increasing the breadth or depth of research coverage. What's the most effective way to address this?", "options": {"A": "Allow both agents to complete their parallel work, then have the coordinator deduplicate overlapping findings before passing to the synthesis agent", "B": "Convert to sequential execution where document analysis runs only after web search completes, using the web search findings as context to avoid duplication", "C": "Have the coordinator explicitly partition the research space before delegation, assigning distinct subtopics or source types to each agent", "D": "Implement a shared state mechanism where agents log their current focus area, allowing other agents to dynamically avoid duplicating work in progress"}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 56, "scenario": "Multi-Agent Research System", "stem": "When designing the system, you gave the document analysis agent access to a general-purpose `fetch_url` tool so it could load documents from URLs. Production logs reveal this agent now frequently fetches search engine result pages to conduct ad-hoc web searches—behavior that should route through the web search agent. This causes inconsistent results. What's the most effective fix?", "options": {"A": "Add instructions to the document analysis agent's prompt clarifying it should only use `fetch_url` for loading document URLs, not searching.", "B": "Replace `fetch_url` with a `load_document` tool that validates URLs point to document formats.", "C": "Implement filtering that blocks `fetch_url` calls to known search engine domains while allowing other URLs.", "D": "Remove `fetch_url` from the document analysis agent and route all URL loading through the coordinator to the web search agent."}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 57, "scenario": "Multi-Agent Research System", "stem": "The document analysis subagent frequently encounters failures when processing PDF files—some have corrupted sections causing parsing exceptions, others are password-protected, and occasionally the parsing library times out on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip the document, or fail the entire research task. This is causing excessive coordinator involvement in routine error handling. What's the most effective architectural improvement?", "options": {"A": "Have the coordinator validate all documents before dispatching to the subagent, rejecting documents likely to cause failures to ensure the subagent only receives processable files.", "B": "Have the subagent implement local recovery for transient failures and only propagate errors it cannot resolve to the coordinator, including what was attempted and any partial results obtained.", "C": "Create a dedicated error-handling agent that monitors all subagent failures via a shared queue and makes recovery decisions independently, dispatching retry commands directly to subagents.", "D": "Configure the subagent to always return partial results with success status, embedding error details in metadata. The coordinator treats all responses as successful and filters problematic items during synthesis."}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 58, "scenario": "Multi-Agent Research System", "stem": "During a materials research task, the web search subagent queries three source categories with different outcomes: academic databases returned 15 relevant papers, industry reports returned \"0 results found,\" and patent databases returned \"Connection timeout.\" When designing error propagation to the coordinator, what approach enables the best recovery decisions?", "options": {"A": "Distinguish access failures (timeout) needing retry decisions from valid empty results (\"0 results\") representing successful queries.", "B": "Report both the timeout and \"0 results\" as failures requiring coordinator intervention.", "C": "Aggregate outcomes into a single success rate metric (e.g., \"67% source coverage\") with detailed logs available on request.", "D": "Have the subagent retry transient failures internally and only report persistent errors."}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 59, "scenario": "Multi-Agent Research System", "stem": "Production monitoring reveals inconsistent synthesis quality. When aggregated results total ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web search headlines and snippets) and the final 10K tokens (document analysis conclusions), but frequently omits critical findings that appear in the middle 50K tokens—even when those findings directly address the research question. How should you restructure the aggregated input?", "options": {"A": "Implement rotation that alternates which subagent's results appear first across different research tasks, ensuring both sources receive primacy positioning equally over time.", "B": "Summarize all subagent outputs to under 20K tokens total before aggregation, ensuring content stays within the model's reliable processing range.", "C": "Stream subagent results to the synthesis agent incrementally, processing web search results first to completion before introducing document analysis findings.", "D": "Place a key findings summary at the beginning of the aggregated input and organize detailed results with explicit section headers for easier navigation."}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 60, "scenario": "Multi-Agent Research System", "stem": "During testing, you observe that the synthesis agent frequently needs to verify specific claims while combining findings. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis with results. This adds 2-3 round trips per task and increases latency by 40%. Your evaluation shows that 85% of these verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation. What's the most effective approach to reduce overhead while maintaining system reliability?", "options": {"A": "Give the synthesis agent a scoped `verify_fact` tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator.", "B": "Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips through the coordinator.", "C": "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass, which then sends them all to the web search agent at once.", "D": "Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify."}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}]};</script>

  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function fmt(s){s=esc(s);s=s.replace(/`([^`]+)`/g,function(_,c){return "<code>"+c+"</code>";});
    s=s.replace(/\*([^*]+)\*/g,function(_,c){return "<em>"+c+"</em>";});return s;}
  function shortScen(n){return ({"Customer Support Resolution Agent":"Customer Support",
    "Code Generation with Claude Code":"Code Generation",
    "Claude Code for Continuous Integration":"CI/CD",
    "Multi-Agent Research System":"Multi-Agent"})[n]||n;}
  function $(id){return document.getElementById(id);}
  function show(id){["screen-start","screen-exam","screen-result","screen-review"].forEach(function(s){
    $(s).style.display=(s===id)?"block":"none";});window.scrollTo(0,0);}

  // ---------- START ----------
  $("s-title").textContent=M.title||"Practice Exam";
  $("s-lede").textContent=M.lede||"";
  $("s-facts").innerHTML=(M.facts||[]).map(function(f){
    return '<div class="f"><span class="k">'+esc(f[0])+'</span><b>'+esc(f[1])+'</b></div>';}).join("");
  $("s-pmode").textContent="Study mode — as soon as you submit a question, the correct answer is revealed and your choice is marked right or wrong, with the reasoning shown. Your overall score and a full review still appear at the end.";
  $("s-disc").innerHTML=M.disclaimer||"";
  $("foot").innerHTML=M.footer||"";

  function refreshResume(){
    var answered=Object.keys(st.ans).length;
    if(st.started && !st.finished && answered>0){
      $("resume-note").style.display="block";
      $("resume-note").innerHTML="You have an exam in progress — <b>"+answered+"/"+Q.length+"</b> answered. "+
        '<a href="#" id="lnk-resume">Resume</a> or <a href="#" id="lnk-reset">start over</a>.';
      $("btn-start").textContent="Resume Exam";
      $("lnk-resume").onclick=function(e){e.preventDefault();startExam(true);};
      $("lnk-reset").onclick=function(e){e.preventDefault();hardReset();};
    } else if(st.finished){
      $("resume-note").style.display="block";
      $("resume-note").innerHTML='You have completed this exam. <a href="#" id="lnk-see">See results</a> or <a href="#" id="lnk-reset2">retake</a>.';
      $("btn-start").textContent="Retake Exam";
      $("lnk-see").onclick=function(e){e.preventDefault();showFinalResult();};
      $("lnk-reset2").onclick=function(e){e.preventDefault();hardReset();};
    } else {$("resume-note").style.display="none";$("btn-start").textContent="Start Exam";}
  }
  function hardReset(){st={i:0,ans:{},submitted:{},flags:{},started:false,finished:false,startTs:null};save();refreshResume();}

  $("btn-start").onclick=function(){startExam(st.started);};
  function startExam(keep){
    if(!keep){st.i=0;st.ans={};st.submitted={};st.flags={};st.finished=false;}
    st.started=true; if(!st.startTs)st.startTs=Date.now(); save();
    show("screen-exam"); renderQ(); startTimer();
  }

  // ---------- TIMER ----------
  var timerInt=null, limitMs=(M.timeLimitMin||90)*60000;
  function startTimer(){ if(timerInt)clearInterval(timerInt); tickTimer(); timerInt=setInterval(tickTimer,1000); }
  function tickTimer(){
    var el=$("exam-status"); if(!el||st.finished){return;}
    var left=Math.max(0,limitMs-(Date.now()-st.startTs));
    if(left<=0){ finishExam(); return; }
    var mm=Math.floor(left/60000), ss=Math.floor((left%60000)/1000);
    var answered=Object.keys(st.ans).length;
    el.innerHTML='<span class="sc">'+answered+' / '+Q.length+' answered</span>'+
      '<span class="timer'+(left<300000?' warn':'')+'">'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss+'</span>';
  }

  // ---------- EXAM RENDER ----------
  function renderProgress(){
    var groups=[[1,15,'S1'],[16,30,'S2'],[31,45,'S3'],[46,60,'S4']];
    var h='<div class="prow">';
    groups.forEach(function(g){
      h+='<span class="slab">'+g[2]+'</span>';
      for(var n=g[0];n<=g[1] && n<=Q.length;n++){
        var cls='pcell'+(st.submitted[n]||st.ans[n]!=null?' done':'')+(n===Q[st.i].q?' cur':'')+(st.flags[n]?' flagged':'');
        h+='<span class="'+cls+'" data-n="'+n+'">'+n+'</span>';
      }
    });
    h+='</div>';
    var p=$("progress");p.innerHTML=h;
    p.querySelectorAll(".pcell").forEach(function(c){c.onclick=function(){
      var n=+c.getAttribute("data-n");var idx=Q.findIndex(function(x){return x.q===n;});if(idx>=0){st.i=idx;save();renderQ();}
    };});
  }

  function renderQ(){
    var q=Q[st.i]; renderProgress();
    var graded=!!st.submitted[q.q];
    var sel=st.ans[q.q]||null;
    var flagged=!!st.flags[q.q];
    var opts=["A","B","C","D"].map(function(L){
      var o=(q.options||{})[L]; if(o==null)o="";
      var cls="opt";
      if(graded){
        if(L===q.correct)cls+=" correct";
        else if(sel===L)cls+=" wrong";
      } else if(sel===L)cls+=" sel";
      return '<div class="'+cls+'" data-l="'+L+'"><div class="b">'+L+'</div><div class="tx">'+fmt(o)+'</div>'+
        '<span class="mk ok">Correct</span><span class="mk no">Your answer</span></div>';
    }).join("");

    // Study mode: as soon as a question is submitted, reveal the correct answer,
    // mark the learner's choice right/wrong, and show the reasoning.
    var expl="";
    if(graded){
      var isRight=(sel===q.correct);
      expl='<div class="expl '+(isRight?'good':'bad')+' show">'+
        '<div class="band">'+(isRight?'✓ Correct':'✗ Incorrect')+'</div>'+
        '<div class="body">'+
          '<div class="ans">Correct answer: <span class="let">'+esc(q.correct)+'</span> — '+fmt((q.options||{})[q.correct]||"")+'</div>'+
          (q.explanation_correct?'<h4>Why it’s right</h4><p>'+fmt(q.explanation_correct)+'</p>':'<p class="noexp">No explanation provided for this question.</p>')+
          (q.study_area?'<div class="sa">Study area: <em>'+fmt(q.study_area)+'</em></div>':'')+
        '</div></div>';
    }

    $("qcard").className="panel qcard"+(graded?" graded":"");
    $("qcard").innerHTML=
      '<div class="qhead"><div class="qn">Question '+q.q+' of '+Q.length+'</div>'+
      '<div class="rt"><button class="flagbtn'+(flagged?' on':'')+'" id="flag">'+(flagged?'⚑ Flagged':'⚐ Flag')+'</button>'+
      '<span class="scnpill">'+esc(q.scenario||"")+'</span></div></div>'+
      '<div class="qstem">'+fmt(q.stem)+'</div>'+
      '<div class="opts" id="opts">'+opts+'</div>'+expl;

    if(!graded){
      $("opts").querySelectorAll(".opt").forEach(function(el){el.onclick=function(){
        st.ans[q.q]=el.getAttribute("data-l");save();renderQ();
      };});
    }
    $("flag").onclick=function(){st.flags[q.q]=!st.flags[q.q];save();renderQ();};

    // nav buttons
    $("btn-prev").disabled=st.i===0;
    var isLast=st.i===Q.length-1;
    $("btn-submit").style.display=graded?"none":"";
    $("btn-submit").disabled=(sel==null);
    $("btn-next").style.display=(graded && !isLast)?"":"none";
    $("btn-finish").style.display=(graded && isLast)?"":"none";
    tickTimer();
  }

  $("btn-submit").onclick=function(){var q=Q[st.i];if(st.ans[q.q]==null)return;st.submitted[q.q]=true;save();renderQ();};
  $("btn-prev").onclick=function(){if(st.i>0){st.i--;save();renderQ();}};
  $("btn-next").onclick=function(){if(st.i<Q.length-1){st.i++;save();renderQ();}};
  $("btn-finish").onclick=function(){finishExam();};

  function showFinalResult(){
    renderResult();
    renderReview();
    $("screen-start").style.display="none";
    $("screen-exam").style.display="none";
    $("screen-result").style.display="block";
    $("screen-review").style.display="block";
    window.scrollTo(0,0);
  }
  function finishExam(){st.finished=true;save();if(timerInt)clearInterval(timerInt);showFinalResult();}

  // ---------- RESULTS ----------
  function tally(){
    var correct=0, per={}; SCEN.forEach(function(n){per[n]={c:0,t:0};});
    Q.forEach(function(q){
      var s=q.scenario; if(per[s])per[s].t++;
      if(st.submitted[q.q] && st.ans[q.q]===q.correct){correct++; if(per[s])per[s].c++;}
    });
    return {correct:correct,per:per,total:Q.length};
  }
  function scaled(c,t){return Math.round(100+(c/t)*900);} // approx 100–1000

  function renderResult(){
    var t=tally(), sc=scaled(t.correct,t.total), passing=M.passingScaled||720, pass=sc>=passing;
    var answered=Object.keys(st.submitted).length;
    var pct=Math.round(t.correct/t.total*100);
    var h='<h2>Assessment Complete</h2>'+
      '<div class="bigscore '+(pass?'pass':'fail')+'">'+sc+'</div>'+
      '<div class="scaleline">Approx. scaled score (100–1000) · passing '+passing+'</div>'+
      '<div class="verdict-big '+(pass?'pass':'fail')+'">'+(pass?'You passed':'You did not meet the passing score')+'</div>'+
      '<div class="rsummary">Correct answers: <b>'+t.correct+' / '+t.total+'</b> ('+pct+'%)'+
        (answered<t.total?' · '+(t.total-answered)+' unanswered':'')+'</div>';
    h+='<div class="rscen"><h3>Performance by scenario</h3>';
    SCEN.forEach(function(n){var p=t.per[n]||{c:0,t:0};var pc=p.t?Math.round(p.c/p.t*100):0;var pp=pc>=60;
      h+='<div class="s'+(pp?' p':'')+'"><div class="nm">'+esc(shortScen(n))+'</div>'+
         '<div class="bar"><i style="width:'+pc+'%"></i></div>'+
         '<div class="fig">'+p.c+'/'+p.t+' ('+pc+'%)</div></div>';});
    h+='</div>';
    h+='<div class="ractions"><button class="cta sec" id="r-retake">Retake exam</button></div>';
    $("rcard").innerHTML=h;
    $("r-retake").onclick=function(){hardReset();show("screen-start");refreshResume();};
    $("exam-status").innerHTML='<span class="sc">Completed</span>';
  }

  // ---------- REVIEW ----------
  var revOpen=false;
  function renderReview(){
    var h="";
    Q.forEach(function(q){
      var sel=st.ans[q.q], sub=st.submitted[q.q], right=sub&&sel===q.correct;
      var v=!sub?'<span class="v sk">Skipped</span>':right?'<span class="v ok">✓</span>':'<span class="v no">✗</span>';
      h+='<div class="panel rev-q" data-q="'+q.q+'"><div class="rh"><div class="l">Q'+q.q+' · '+esc(shortScen(q.scenario))+
         ' — '+fmt((q.stem||"").slice(0,90))+'…</div>'+v+'</div><div class="rev-body">'+
         '<div class="qstem" style="font-size:15px">'+fmt(q.stem)+'</div>';
      ["A","B","C","D"].forEach(function(L){
        var cls="o"+(L===q.correct?" c":"")+((sel===L&&L!==q.correct)?" w":"");
        h+='<div class="'+cls+'"><b>'+L+'.</b> '+fmt((q.options||{})[L]||"")+(L===q.correct?' &nbsp;✓ correct':'')+
           ((sel===L&&L!==q.correct)?' &nbsp;✗ your choice':'')+'</div>';
      });
      if(q.explanation_correct)h+='<h4 style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 3px">Why it’s right</h4><p style="font-size:14px;margin:0">'+fmt(q.explanation_correct)+'</p>';
      if(q.study_area)h+='<div class="sa" style="font-size:13px;color:var(--muted);margin-top:8px">Study area: <em>'+fmt(q.study_area)+'</em></div>';
      h+='</div></div>';
    });
    $("rev-list").innerHTML=h;
    $("rev-list").querySelectorAll(".rev-q .rh").forEach(function(rh){rh.onclick=function(){rh.parentNode.classList.toggle("open");};});
  }
  $("rev-title").textContent="Review — all "+Q.length+" questions";
  $("rev-expand").onclick=function(){revOpen=!revOpen;
    document.querySelectorAll(".rev-q").forEach(function(x){x.classList.toggle("open",revOpen);});
    $("rev-expand").textContent=revOpen?"Collapse all":"Expand all";};

  // ---------- boot ----------
  if(st.finished){show("screen-start");refreshResume();}
  else if(st.started){show("screen-exam");renderQ();startTimer();}
  else {show("screen-start");refreshResume();}
})();
</script>
</body>
</html>
