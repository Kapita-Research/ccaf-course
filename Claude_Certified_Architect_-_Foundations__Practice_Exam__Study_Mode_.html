<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Certified Architect — Foundations · Practice Exam (Study Mode)</title>
<style>
  :root{
    --paper:#F7F4EF; --card:#FFFFFF; --ink:#1E1B17; --muted:#6E6559; --line:#E7DECF;
    --accent:#CC785C; --accent-d:#B5583B; --accent-soft:#F5E5DB;
    --ok:#2C7A55; --ok-bg:#E7F4EC; --ok-line:#B4DcC5;
    --no:#B23B2E; --no-bg:#FBEAE6; --no-line:#EBC5BD;
    --chip:#F0E8DB; --code:#A64B2E; --dark:#221F1A;
    --shadow:0 1px 2px rgba(40,30,15,.05),0 10px 34px rgba(40,30,15,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .serif{font-family:Georgia,"Times New Roman",serif}
  code{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--chip);
    color:var(--code);padding:1px 6px;border-radius:5px;white-space:nowrap}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}

  /* top brand bar */
  .brand{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
  .brand .in{max-width:900px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .logo{font-weight:800;letter-spacing:.02em;font-size:17px}
  .logo b{color:var(--accent)}
  .exam-status{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:5px 10px;font-size:13.5px}
  .timer.warn{color:var(--no);border-color:var(--no-line);background:var(--no-bg)}
  .exam-status .sc{font-weight:700;color:var(--ink)}

  /* generic card */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

  /* ---------- START SCREEN ---------- */
  #screen-start{padding:40px 0 90px}
  .kick{font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;text-align:center;margin:0 0 10px}
  #screen-start h1{font-size:33px;font-weight:600;text-align:center;margin:0 0 6px;line-height:1.15}
  #screen-start .lede{text-align:center;color:var(--muted);max-width:560px;margin:0 auto 26px}
  .start-card{max-width:600px;margin:0 auto;padding:30px 34px 34px;text-align:center}
  .start-card h2{font-size:24px;margin:0 0 22px;font-weight:600}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;max-width:440px;margin:0 auto 8px;text-align:left}
  .facts .f{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
  .facts .f .k{color:var(--muted)}
  .facts .f b{font-weight:600}
  .pmode{color:var(--accent-d);font-style:italic;font-size:14px;margin:18px auto 24px;max-width:420px}
  .cta{display:inline-block;background:var(--dark);color:#fff;border:0;border-radius:11px;padding:14px 30px;font-size:16px;
    font-weight:600;cursor:pointer;transition:transform .06s,background .15s}
  .cta:hover{background:#000}
  .cta:active{transform:translateY(1px)}
  .cta.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .cta.sec:hover{border-color:var(--accent);background:var(--card)}
  .disclaimer{max-width:600px;margin:22px auto 0;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.55}
  .resume-note{max-width:600px;margin:16px auto 0;font-size:13px;background:#FBF8F2;border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:8px;padding:11px 14px;display:none}

  /* ---------- EXAM SCREEN ---------- */
  #screen-exam{display:none;padding:18px 0 120px}
  .progress{margin:6px 0 16px}
  .prow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
  .slab{font-size:11px;font-weight:800;color:var(--muted);margin:0 4px 0 2px;letter-spacing:.03em}
  .pcell{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s}
  .pcell:hover{border-color:var(--accent)}
  .pcell.done{background:#Dff0E6;border-color:var(--ok-line);color:var(--ok)}
  .pcell.cur{background:var(--dark);border-color:var(--dark);color:#fff}
  .pcell.flagged{box-shadow:inset 0 0 0 2px var(--accent)}

  .qcard{padding:26px 30px 22px;margin-top:8px}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .qhead .qn{font-size:18px;font-weight:600}
  .qhead .rt{display:flex;gap:10px;align-items:center}
  .flagbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer;
    color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
  .flagbtn.on{color:var(--accent);border-color:var(--accent)}
  .scnpill{background:var(--accent-soft);color:var(--accent-d);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700}
  .qstem{font-size:17.5px;line-height:1.6;margin:6px 0 20px}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;
    background:var(--card);cursor:pointer;transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--accent)}
  .opt .b{flex:0 0 28px;height:28px;border-radius:50%;background:var(--dark);color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  .opt .tx{flex:1;padding-top:2px}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .b{background:var(--accent)}
  /* graded */
  .graded .opt{cursor:default}
  .graded .opt:hover{border-color:var(--line)}
  .graded .opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
  .graded .opt.correct .b{background:var(--ok)}
  .graded .opt.wrong{border-color:var(--no-line);background:var(--no-bg)}
  .graded .opt.wrong .b{background:var(--no)}
  .opt .mk{margin-left:auto;align-self:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;display:none}
  .graded .opt.correct .mk.ok{display:inline-block;background:var(--ok);color:#fff}
  .graded .opt.wrong .mk.no{display:inline-block;background:var(--no);color:#fff}

  .expl{margin-top:18px;border-radius:12px;padding:0;display:none;overflow:hidden}
  .graded .expl.show{display:block}
  .expl .band{padding:10px 18px;font-weight:700;font-size:14px}
  .expl.good .band{background:var(--ok-bg);color:var(--ok)}
  .expl.bad .band{background:var(--no-bg);color:var(--no)}
  .expl .body{padding:14px 18px 16px;background:#FCFAF6;border:1px solid var(--line);border-top:0;
    border-radius:0 0 12px 12px}
  .expl .ans{font-weight:600;margin-bottom:8px}
  .expl .ans .let{color:var(--ok);font-weight:700}
  .expl h4{margin:12px 0 4px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .expl p{margin:0 0 8px;font-size:14.5px;line-height:1.58}
  .expl .sa{font-size:13px;color:var(--muted);margin-top:8px}
  .expl .sa em{color:var(--ink)}
  .expl .noexp{font-size:13.5px;color:var(--muted)}

  .navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
  .navrow .left,.navrow .right{display:flex;gap:10px}
  .nbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 20px;font-size:14.5px;
    font-weight:600;cursor:pointer}
  .nbtn:hover{border-color:var(--accent)}
  .nbtn[disabled]{opacity:.4;cursor:not-allowed}
  .nbtn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
  .nbtn.primary:hover{background:#000}
  .nbtn.primary[disabled]{background:#B9B1A4;border-color:#B9B1A4}

  /* ---------- RESULTS ---------- */
  #screen-result{display:none;padding:34px 0 100px}
  .rcard{max-width:640px;margin:0 auto;padding:34px 34px 30px;text-align:center}
  .rcard h2{font-size:25px;margin:0 0 18px;font-weight:600}
  .bigscore{font-size:58px;font-weight:800;line-height:1;font-family:Georgia,serif}
  .bigscore.pass{color:var(--ok)} .bigscore.fail{color:var(--accent)}
  .scaleline{color:var(--muted);font-size:13.5px;margin-top:6px}
  .verdict-big{font-weight:700;margin:16px 0 6px;font-size:16px}
  .verdict-big.pass{color:var(--ok)} .verdict-big.fail{color:var(--no)}
  .rsummary{font-size:14.5px;color:var(--muted);margin-bottom:8px}
  .rscen{margin:22px 0 6px;text-align:left}
  .rscen h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .rscen .s{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  .rscen .s .nm{font-size:14px;font-weight:600}
  .rscen .s .bar{grid-column:1/2;height:7px;border-radius:6px;background:var(--accent-soft);overflow:hidden}
  .rscen .s .bar>i{display:block;height:100%;background:var(--accent)}
  .rscen .s.p .bar>i{background:var(--ok)}
  .rscen .s .fig{grid-column:2/3;grid-row:1/3;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .ractions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}

  /* review list */
  #screen-review{display:none;padding:22px 0 110px}
  #screen-review h2{font-size:22px;margin:6px 0 14px;font-weight:600}
  .rev-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .rev-q{margin:10px 0;padding:16px 20px}
  .rev-q .rh{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
  .rev-q .rh .l{font-size:14.5px;font-weight:600}
  .rev-q .rh .v{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .rev-q .rh .v.ok{background:var(--ok-bg);color:var(--ok)}
  .rev-q .rh .v.no{background:var(--no-bg);color:var(--no)}
  .rev-q .rh .v.sk{background:var(--chip);color:var(--muted)}
  .rev-body{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .rev-q.open .rev-body{display:block}
  .rev-body .o{font-size:14px;padding:6px 10px;border-radius:8px;margin:5px 0}
  .rev-body .o.c{background:var(--ok-bg);color:#1f5e40}
  .rev-body .o.w{background:var(--no-bg);color:#7f2b22}

  footer{max-width:900px;margin:0 auto;padding:26px 20px 40px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}

  @media (max-width:560px){
    #screen-start h1{font-size:26px}
    .facts{grid-template-columns:1fr}
    .qcard{padding:18px 16px}
    .start-card{padding:24px 18px}
    .qhead{flex-wrap:wrap}
    .pcell{width:23px;height:23px;font-size:10px}
    .opt .mk{display:none!important}
    .navrow .nbtn{padding:11px 14px}
  }
</style>
</head>
<body>
<div class="brand"><div class="in">
  <div class="logo">ANTHROP<b>\</b>C&nbsp;<span style="color:var(--muted);font-weight:600;font-size:13px">Academy</span></div>
  <div class="exam-status" id="exam-status"></div>
</div></div>

<!-- START -->
<section id="screen-start"><div class="wrap">
  <p class="kick">Certification · Practice Exam</p>
  <h1 class="serif" id="s-title">Claude Certified Architect — Foundations</h1>
  <p class="lede" id="s-lede"></p>
  <div class="panel start-card">
    <h2>Certification Assessment</h2>
    <div class="facts" id="s-facts"></div>
    <p class="pmode" id="s-pmode"></p>
    <button class="cta" id="btn-start">Start Exam</button>
    <div class="resume-note" id="resume-note"></div>
  </div>
  <p class="disclaimer" id="s-disc"></p>
</div></section>

<!-- EXAM -->
<section id="screen-exam"><div class="wrap">
  <div class="progress" id="progress"></div>
  <div class="panel qcard" id="qcard"></div>
  <div class="navrow">
    <div class="left"><button class="nbtn" id="btn-prev">← Previous</button></div>
    <div class="right">
      <button class="nbtn primary" id="btn-submit">Submit Answer</button>
      <button class="nbtn" id="btn-next">Next →</button>
      <button class="nbtn primary" id="btn-finish" style="display:none">Finish ▸</button>
    </div>
  </div>
</div></section>

<!-- RESULT -->
<section id="screen-result"><div class="wrap">
  <div class="panel rcard" id="rcard"></div>
</div></section>

<!-- REVIEW -->
<section id="screen-review"><div class="wrap">
  <h2 id="rev-title">Review — all questions</h2>
  <div class="rev-controls">
    <button class="cta sec" id="rev-expand">Expand all</button>
  </div>
  <div id="rev-list"></div>
</div></section>

<footer id="foot"></footer>

<script>window.EXAM = {"meta": {"title": "Claude Certified Architect — Foundations", "lede": "A self-contained replica of Anthropic's official practice exam. It runs in practice mode: pick an answer, see whether it's right and the explanation, then get a scored result at the end.", "facts": [["Scenarios", "4 (randomly selected)"], ["Questions per scenario", "15"], ["Total questions", "60"], ["Passing score", "720 / 1000"], ["Time limit", "90 minutes"]], "pmode": "Practice mode — an explanation is shown after each submitted answer.", "passingScaled": 720, "timeLimitMin": 90, "scenarios": [{"name": "Customer Support Resolution Agent"}, {"name": "Code Generation with Claude Code"}, {"name": "Claude Code for Continuous Integration"}, {"name": "Multi-Agent Research System"}], "disclaimer": "Reconstructed for internal study use within one Claude Partner Network cohort, from a recording of the Anthropic Academy practice exam (since retired). It is a replica, not the official exam: treat its wording as practice material, and the official exam guide as the source of truth. Not affiliated with or endorsed by Anthropic; question content © Anthropic. Your progress is saved only in this browser.", "footer": "Claude Certified Architect — Foundations · practice-exam replica · 60 questions across 4 scenarios. Built for one Claude Partner Network cohort."}, "questions": [{"q": 1, "scenario": "Customer Support Resolution Agent", "stem": "Production logs reveal a consistent pattern: when customers include \"account\" in messages (e.g., \"I want to check my account for the order I placed yesterday\"), the agent calls `get_customer` first 78% of the time. When customers phrase similar requests without \"account\" (e.g., \"I want to check on the order I placed yesterday\"), it calls `lookup_order` first 93% of the time. The tool descriptions are well-written and unambiguous. What is the most likely root cause of this discrepancy?", "options": {"A": "The system prompt contains keyword-sensitive instructions that steer behavior based on terms like \"account,\" creating unintended tool selection patterns", "B": "The model requires more training data on multi-concept messages and should be fine-tuned on examples that include both account and order language", "C": "The model's base training creates associations between \"account\" terminology and customer-related operations that override the tool descriptions", "D": "The tool descriptions need additional negative examples specifying when NOT to use each tool to prevent this keyword-triggered confusion"}, "correct": "A", "explanation_correct": "This is the most likely root cause because the systematic, keyword-triggered pattern (78% vs 93%) strongly suggests explicit routing logic in the system prompt that reacts to the word \"account\" and directs the agent toward customer-related tools. Since the tool descriptions are already well-written and unambiguous, the discrepancy points to prompt-level instructions creating unintended behavioral steering.", "study_area": "Customer Support Resolution Agent — review Tool Selection Reliability concepts in the exam study guide.", "distractors": {"D": "Adding negative examples to tool descriptions contradicts the stated premise that the descriptions are already well-written and unambiguous. The issue is not with the tool descriptions themselves but with upstream instructions in the system prompt that override correct tool selection based on keyword triggers."}, "clipped": false}, {"q": 2, "scenario": "Customer Support Resolution Agent", "stem": "You're implementing the agentic loop for your support agent. After each API call to Claude, you need to determine whether to continue the loop (execute tools and call Claude again) or stop (present the final response to the customer). What determines this decision?", "options": {"A": "Set a maximum iteration count (e.g., 10 calls) and stop when reached, regardless of whether Claude indicates more work is needed.", "B": "Check the `stop_reason` field in Claude's response—continue when it equals `\"tool_use\"` and stop when it equals `\"end_turn\"`.", "C": "Check whether the response includes any assistant text content—if Claude generated explanatory text, the loop should end.", "D": "Parse Claude's response text for phrases like \"I've completed\" or \"Is there anything else?\"—these natural language signals indicate the task is complete."}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 3, "scenario": "Customer Support Resolution Agent", "stem": "In testing, you notice the agent frequently calls `get_customer` when users ask about order status, even though `lookup_order` would be more appropriate. What should you examine first to address this issue?", "options": {"A": "Add few-shot examples covering every possible order-related query pattern to the system prompt", "B": "Implement a pre-processing classifier that detects order queries and routes directly to `lookup_order`", "C": "Reduce the number of tools available to the agent to simplify selection", "D": "Review tool descriptions to ensure they clearly distinguish each tool's purpose"}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 4, "scenario": "Customer Support Resolution Agent", "stem": "Production logs reveal that the agent misinterprets data from your MCP tools: Unix timestamps from `get_customer`, ISO 8601 dates from `lookup_order`, and numeric status codes (1=pending, 2=shipped). Some tools are third-party MCP servers you cannot modify. What's the most maintainable approach to normalize data formats?", "options": {"A": "Create a `normalize_data` tool that the agent calls after each data retrieval to transform values", "B": "Use a PostToolUse hook to intercept tool results and apply formatting transformations before agent processing", "C": "Modify tools you control to return human-readable formats; create wrapper tools for third-party tools", "D": "Add detailed format documentation to your system prompt explaining each tool's data conventions"}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 5, "scenario": "Customer Support Resolution Agent", "stem": "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases (standard damage replacements with photographic evidence) while attempting to autonomously handle complex situations requiring policy exceptions. What's the most effective way to improve escalation calibration?", "options": {"A": "Have the agent self-report a confidence score (1-10) before each response and automatically route requests to humans when confidence falls below a threshold.", "B": "Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold.", "C": "Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously.", "D": "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing."}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 6, "scenario": "Customer Support Resolution Agent", "stem": "Your support agent uses progressive summarization—when context reaches 70% capacity, older turns are summarized while recent ones remain verbatim. Production logs reveal a pattern: customers reference specific amounts (\"the 15% discount I mentioned\"), but the agent responds with incorrect values. Investigation shows these details were stated 20+ turns ago and got condensed into vague summaries like \"discussed promotional pricing.\" What's the most effective fix?", "options": {"A": "Increase the summarization threshold from 70% to 85% capacity so conversations have more room before summarization triggers.", "B": "Store full conversation history externally and implement retrieval to search it when the agent detects reference phrases like \"as I mentioned.\"", "C": "Extract transactional facts (amounts, dates, order numbers) into a persistent \"case facts\" block included in each prompt, outside the summarized history.", "D": "Revise the summarization prompt to explicitly preserve all numerical values, percentages, dates, and customer-stated expectations verbatim."}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 7, "scenario": "Customer Support Resolution Agent", "stem": "Production metrics show your agent averages 4+ API round-trips per resolution. Analysis reveals Claude frequently requests `get_customer` and `lookup_order` in separate sequential turns even when both are needed upfront. What’s the most effective way to reduce round-trips?", "options": {"A": "Implement speculative execution that automatically calls likely-needed tools alongside any requested tool, returning all results regardless of what was requested.", "B": "Increase `max_tokens` to give Claude more space to plan ahead and naturally batch its tool requests.", "C": "Prompt Claude to batch tool requests per turn, and return all tool results together before the next API call.", "D": "Create composite tools like `get_customer_with_orders` that bundle common lookup combinations into single calls."}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 8, "scenario": "Customer Support Resolution Agent", "stem": "Production logs show the agent sometimes selects `get_customer` when `lookup_order` would be more appropriate, particularly for ambiguous requests like “I need help with my recent purchase.” You decide to add few-shot examples to your system prompt to improve tool selection. Which approach will most effectively address this issue?", "options": {"A": "Add 4-6 examples targeting ambiguous scenarios, each showing reasoning for why one tool was chosen over plausible alternatives.", "B": "Add 10-15 examples of clear, unambiguous requests that demonstrate correct tool selection for each tool’s typical use cases.", "C": "Add explicit “use when” and “do not use when” guidelines in each tool’s description covering the ambiguous cases.", "D": "Add examples grouped by tool—all `get_customer` scenarios together, then all `lookup_order` scenarios."}, "correct": "A", "explanation_correct": "Targeting few-shot examples at the specific ambiguous scenarios where errors occur, with explicit reasoning about why one tool is preferred over another, directly teaches the model the comparative decision-making process it needs for edge cases. This approach is the most effective because worked examples demonstrating reasoning are better than declarative rules for nuanced tool selection.", "study_area": "Customer Support Resolution Agent — review Tool Selection Reliability concepts in the exam study guide.", "distractors": {"C": "Adding explicit usage guidelines to tool descriptions can help, but static declarative rules are less effective than worked examples for teaching nuanced edge-case reasoning. The model benefits more from seeing the actual decision process in context than from reading abstract rules about when to use or avoid each tool."}, "clipped": false}, {"q": 9, "scenario": "Customer Support Resolution Agent", "stem": "Your `get_customer` tool returns all matches when searching by name. Claude currently picks the customer with the most recent order when multiple results are returned, but production data shows this causes 15% of multi-match cases to proceed with the wrong customer account. How should you address this?", "options": {"A": "Implement a confidence scoring system that proceeds automatically above 85% confidence and prompts for clarification below that threshold.", "B": "Modify `get_customer` to return only the single most likely match based on a ranking algorithm, simplifying Claude’s decision by eliminating ambiguous results.", "C": "Add few-shot examples showing Claude how to use conversational context (products mentioned, dates referenced) to infer the correct customer without requiring clarification.", "D": "Instruct Claude to ask for an additional identifier (email, phone, or order number) when `get_customer` returns multiple matches, before taking any customer-specific action."}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 10, "scenario": "Customer Support Resolution Agent", "stem": "After calling `get_customer` and `lookup_order`, the agent has retrieved all available system data but faces uncertainty. Which situation represents the most appropriate trigger for calling `escalate_to_human`?", "options": {"A": "The customer wants to cancel an order that shipped yesterday, with delivery scheduled for tomorrow. The agent should escalate because the customer might change their mind once they receive the package.", "B": "The customer claims they never received their order, but tracking shows it was delivered and signed for at their address three days ago. The agent should escalate because presenting contradictory evidence might damage the customer relationship.", "C": "The customer's message mentions both a billing question and a product return. The agent should escalate so a human can coordinate handling both issues in a single interaction.", "D": "The customer requests a price match against a competitor. Your policies allow adjustments for price drops on your own site within 14 days but are silent on competitor pricing. The agent should escalate for policy interpretation."}, "correct": "D", "explanation_correct": "This represents a genuine policy gap where the company's guidelines cover own-site price drops but are silent on competitor price matching, meaning the agent cannot […]", "study_area": null, "distractors": {}, "clipped": false}, {"q": 11, "scenario": "Customer Support Resolution Agent", "stem": "Production data shows that in 12% of cases, your agent skips `get_customer` entirely and calls `lookup_order` using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds. What change would most effectively address this reliability issue?", "options": {"A": "Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type.", "B": "Add few-shot examples showing the agent always calling `get_customer` first, even when customers volunteer order details.", "C": "Add a programmatic prerequisite that blocks `lookup_order` and `process_refund` calls until `get_customer` has returned a verified customer ID.", "D": "Enhance the system prompt to state that customer verification via `get_customer` is mandatory before any order operations."}, "correct": "C", "explanation_correct": "Adding a programmatic prerequisite that blocks downstream tools until `get_customer` returns a verified customer ID provides a deterministic guarantee that the required sequence is followed. This is the most effective approach because it removes the possibility of the agent skipping verification, regardless of LLM behavior.", "study_area": null, "distractors": {}, "clipped": false}, {"q": 12, "scenario": "Customer Support Resolution Agent", "stem": "Production logs show that for simple requests like \"refund order #1234\", your agent succeeds in 3-4 tool calls with 91% resolution rate. However, for complex requests like \"I've been charged twice, my discount didn't apply, and I want to cancel\", the agent averages 12+ tool calls with only 54% resolution—often investigating concerns sequentially and gathering redundant customer data for each one. What's the most effective change to improve complex request handling?", "options": {"A": "Reduce the number of available tools by consolidating get_customer, lookup_order, and billing-related lookups into a single investigate_issue tool.", "B": "Add explicit verification gates between steps requiring the agent to checkpoint after resolving each concern before moving to the next.", "C": "Decompose the request into distinct concerns, then investigate each in parallel using shared customer context before synthesizing a resolution.", "D": "Add few-shot examples demonstrating ideal tool call sequences for various multi-part billing scenarios to your system prompt."}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 13, "scenario": "Customer Support Resolution Agent", "stem": "Production metrics show that when your agent resolves complex cases involving billing disputes or multi-order returns, customer satisfaction scores are 15% lower than for simple cases—even when the resolution is technically correct. Root cause analysis reveals the agent provides accurate resolutions but inconsistently explains the reasoning: sometimes omitting relevant policy details, other times missing timeline information or next steps. The specific context gaps vary by case. You want to improve resolution quality without adding human review overhead. Which approach is most effective?", "options": {"A": "Increase the model tier from Haiku to Sonnet for complex cases, routing based on detected case complexity.", "B": "Implement few-shot examples in the system prompt showing complete resolution explanations for five common complex case types, demonstrating how to include policy context, timelines, and next steps.", "C": "Add a confirmation step where the agent asks \"Does this fully address your concern?\" before closing, letting customers request additional information if needed.", "D": "Add a self-critique step where the agent evaluates its draft response for completeness—ensuring it addresses the customer's concern, includes relevant context, and anticipates follow-up questions."}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 14, "scenario": "Customer Support Resolution Agent", "stem": "Your agent handles single-concern requests with 94% accuracy (e.g., \"I need a refund for order #1234\"). However, when customers include multiple concerns in one message (e.g., \"I need a refund for order #1234 and also want to update my shipping address for order #5678\"), tool selection accuracy drops to 58%. The agent typically addresses only one concern or mixes up parameters between requests. What's the most effective approach to improve reliability for multi-concern requests?", "options": {"A": "Consolidate related tools into fewer, more general-purpose tools.", "B": "Implement a preprocessing layer that uses a separate model call to decompose multi-concern messages into individual requests, process each independently, then combine the results.", "C": "Implement response validation that detects incomplete responses and automatically re-prompts the agent to address any missed concerns.", "D": "Add few-shot examples to your prompt demonstrating the correct reasoning and tool sequence for multi-concern requests."}, "correct": "D", "explanation_correct": "Adding few-shot examples demonstrating correct reasoning and tool sequencing for multi-concern requests is the most effective approach because the agent already handles individual concerns well at 94% accuracy—it simply needs pattern guidance for handling multiple concerns in one message. This is a low-cost, proven technique that directly addresses the root cause of the agent failing to decompose and properly route parameters across multiple requests.", "study_area": "Customer Support Resolution Agent — review Tool Selection Reliability concepts in the exam study guide.", "distractors": {"B": "Using a separate model call to decompose multi-concern messages adds unnecessary latency, complexity, and cost when the agent already demonstrates strong single-concern understanding. This over-engineers the solution when simpler prompt-level guidance can address the pattern recognition gap."}, "clipped": false}, {"q": 15, "scenario": "Customer Support Resolution Agent", "stem": "Production logs show the agent frequently calls `get_customer` when users ask about orders (e.g., \"check my order #12345\"), instead of calling `lookup_order`. Both tools have minimal descriptions (\"Retrieves customer information\" / \"Retrieves order details\") and accept similar identifier formats. What's the most effective first step to improve tool selection reliability?", "options": {"A": "Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5-8 examples showing order-related queries routing to `lookup_order`.", "B": "Expand each tool's description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools.", "C": "Implement a routing layer that parses user input before each turn and pre-selects the appropriate tool based on detected keywords and identifier patterns.", "D": "Consolidate both tools into a single `lookup_entity` tool that accepts any identifier and internally determines which backend to query."}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 16, "scenario": "Code Generation with Claude Code", "stem": "You've been assigned to restructure the team's monolithic application into microservices. This will involve changes across dozens of files and requires decisions about service boundaries and module dependencies. Which approach should you take?", "options": {"A": "Use direct execution with comprehensive upfront instructions detailing exactly how each service should be structured.", "B": "Start with direct execution and make changes incrementally, letting the implementation reveal the natural service boundaries.", "C": "Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes.", "D": "Begin in direct execution mode and only switch to plan mode if you encounter unexpected complexity during implementation."}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 17, "scenario": "Code Generation with Claude Code", "stem": "Your team's CLAUDE.md file has grown to over 500 lines, mixing TypeScript conventions, testing guidelines, API patterns, and deployment procedures. Developers find it difficult to locate and update relevant sections. What approach does Claude Code support for organizing project-level instructions into focused, topic-specific modules?", "options": {"A": "Create separate markdown files in `.claude/rules/`, each covering one topic (e.g., `testing.md`, `api-conventions.md`)", "B": "Split instructions into README.md files in relevant subdirectories, which Claude automatically loads as instructions", "C": "Create multiple files named `CLAUDE.md` at different levels of the directory tree, each one overriding the parent's instructions", "D": "Define a `.claude/config.yaml` file that maps file patterns to specific sections within CLAUDE.md"}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 18, "scenario": "Code Generation with Claude Code", "stem": "Your team has created a `/migration` skill that generates database migration files. The skill accepts a migration name via `$ARGUMENTS`. In production, you're seeing three issues: (1) developers often invoke the skill without arguments, resulting in poorly-named files, (2) the skill sometimes incorporates database schema details from unrelated earlier conversations, and (3) a developer accidentally triggered destructive test cleanup when the skill had broad tool access. Which configuration approach addresses all three issues?", "options": {"A": "Include validation instructions in the skill's SKILL.md that direct Claude to verify `$ARGUMENTS` contains a valid name, add prompts to ignore prior conversation context, and list forbidden operations Claude should avoid.", "B": "Split into separate `/migration-create` and `/migration-apply` skills, add instructions in each SKILL.md to request a migration name if not provided, and use different `allowed-tools` scopes for each skill.", "C": "Use positional parameters `$1` and `$2` instead of `$ARGUMENTS` to enforce specific inputs, include explicit schema file references via `@` syntax to control context, and add `description` frontmatter warning about destructive operations.", "D": "Add `argument-hint` frontmatter to prompt for required parameters, use `context: fork` to isolate execution, and restrict `allowed-tools` to file write operations."}, "correct": "D", "explanation_correct": "This approach correctly uses three distinct skill configuration features to address each issue: `argument-hint` frontmatter shows expected parameters during autocomplete (addressing missing arguments), `context: fork` isolates execution in a subagent context separate from conversation history (preventing c[…] conversations), and `allowed-tools` restricts tool access to only file write operations (preventing destructive actions).", "study_area": "Code Generation with Claude Code — review Custom Slash Commands concepts in the exam study guide.", "distractors": {}, "clipped": false}, {"q": 19, "scenario": "Code Generation with Claude Code", "stem": "Your codebase has distinct areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow a repository pattern. Test files are spread throughout the codebase alongside the code they test (e.g., `Button.test.tsx` next to `Button.tsx`), and you want all tests to follow the same conventions regardless of location. What's the most maintainable way to ensure Claude automatically applies the correct conventions when generating code?", "options": {"A": "Create rule files in `.claude/rules/` with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths", "B": "Create skills in `.claude/skills/` for each code type that include the relevant conventions in their SKILL.md files", "C": "Consolidate all conventions in the root CLAUDE.md file under headers for each area, relying on Claude to infer which section applies", "D": "Place a separate CLAUDE.md file in each subdirectory containing that area's specific conventions"}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 20, "scenario": "Code Generation with Claude Code", "stem": "You've found that including 2-3 full exemplar endpoint implementations as context significantly improves consistency when generating new API endpoints. However, this context is only useful for creating new endpoints—not for bug fixes, code reviews, or other API directory work. What's the most efficient configuration approach?", "options": {"A": "Configure path-specific rules in .claude/rules/api/ that include the exemplar code and activate when working in the API directory.", "B": "Create a skill that references the exemplar endpoints and includes pattern-following instructions, invoked on-demand via slash command.", "C": "Add the exemplar endpoint code with pattern documentation to the project CLAUDE.md file so it's automatically available.", "D": "Reference the exemplar endpoints manually in each generation request by copying relevant code into your prompt."}, "correct": "B", "explanation_correct": "Creating a skill with the exemplar endpoints and pattern-following instructions allows on-demand invocation via a slash command, ensuring the context is loaded only when generating new endpoints and not during unrelated tasks like bug fixes or code reviews.", "study_area": "Code Generation with Claude Code — review Custom Slash Commands concepts in the exam study guide.", "distractors": {"A": "Path-specific rules that activate when working in the API directory would trigger for all API directory work, including bug fixes and code reviews—exactly the scenarios where the exemplar context is unnecessary and wasteful."}, "clipped": false}, {"q": 21, "scenario": "Code Generation with Claude Code", "stem": "You've asked Claude Code to implement a function that transforms API responses into a normalized internal format. After two iterations, the output structure still doesn't match expectations—some fields are nested differently and timestamps aren't formatted correctly. You've been describing the requirements in prose, but Claude seems to interpret them differently each time. What's the most effective approach for the next iteration?", "options": {"A": "Rewrite your requirements with greater technical precision, specifying exact field mappings, nesting rules, and timestamp format strings.", "B": "Write a JSON schema defining the expected output structure and validate Claude's output against it after each iteration.", "C": "Ask Claude to explain its current interpretation of the requirements so you can identify where understanding diverges.", "D": "Provide 2-3 concrete input-output examples showing the expected transformation for representative API responses."}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 22, "scenario": "Code Generation with Claude Code", "stem": "Your team wants to add a GitHub MCP server to enable PR lookups and CI status checks through Claude Code. Each of the six developers has their own GitHub personal access token. You want consistent tooling across the team without committing credentials to version control. What's the most effective configuration approach?", "options": {"A": "Add the server to a project-scoped `.mcp.json` with environment variable expansion (`${GITHUB_TOKEN}`) for authentication, and document the required environment variable in your project README.", "B": "Create an MCP server wrapper that reads tokens from a `.env` file and proxies requests to the GitHub API, then add this wrapper to your project `.mcp.json`.", "C": "Have each developer configure the server in user scope with `claude mcp add --scope user`.", "D": "Configure the server in project scope with a placeholder token value, then instruct developers to override it in their local scope configuration."}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 23, "scenario": "Code Generation with Claude Code", "stem": "You need to add Slack as a new notification channel. The existing codebase has clear, consistent patterns for email, SMS, and push channels. However, the Slack API offers fundamentally different integration approaches—incoming webhooks (simple, one-way only), bot tokens (enables delivery confirmation and programmatic control), or Slack Apps (bidirectional events, requires workspace approval). Your ticket says \"add Slack support\" without specifying which integration method or whether advanced features like delivery tracking will be needed. How should you approach this task?", "options": {"A": "Start direct execution using the bot token approach to enable delivery confirmation capabilities.", "B": "Enter plan mode to explore the integration options and their architectural implications, then present a recommendation before implementing.", "C": "Start direct execution to scaffold the Slack channel class following existing patterns, deferring the integration method decision until later.", "D": "Start direct execution using incoming webhooks to match the existing one-way notification pattern."}, "correct": "B", "explanation_correct": "This is correct because the Slack integration involves multiple valid approaches with significantly different architectural implications, and the requirements are ambiguous. Using plan mode to explore trade-offs between webhooks, bot tokens, and Slack Apps allows for an informed recommendation and team alignment before committing to an implementation path.", "study_area": null, "distractors": {}, "clipped": false}, {"q": 24, "scenario": "Code Generation with Claude Code", "stem": "You're creating a custom `/explore-alternatives` skill that your team uses to brainstorm and evaluate different implementation approaches before committing to one. However, developers report that after running this skill, Claude's subsequent responses are influenced by the exploration discussion—sometimes referencing abandoned approaches or maintaining exploratory context that confuses actual implementation work. What's the most effective way to configure this skill?", "options": {"A": "Create the skill in `~/.claude/skills/` instead of `.claude/skills/`.", "B": "Add `context: fork` to the skill's frontmatter.", "C": "Split the skill into two separate skills— `/explore-start` and `/explore-end` —to demarcate when exploration context should be discarded.", "D": "Use the `!` prefix in the skill to execute the exploration logic as a bash subprocess."}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 25, "scenario": "Code Generation with Claude Code", "stem": "You're adding error handling wrappers to external API calls across a 120-file codebase. The task has three phases: (1) discovering all API call locations and patterns, (2) designing the error handling approach collaboratively, and (3) implementing wrappers consistently. During Phase 1, Claude generates verbose output listing hundreds of call sites with context. Your context window is filling rapidly before you've finished discovery. What's the most effective approach to complete this while maintaining implementation consistency?", "options": {"A": "Use the Explore subagent for Phase 1 to isolate verbose output and return a summary, then continue Phases 2-3 in the main conversation.", "B": "Continue all phases in the main conversation, using /compact periodically to reduce context usage as you progress through the files.", "C": "Define your error handling pattern in CLAUDE.md, then process files in batches across multiple sessions, relying on the shared memory file for consistency.", "D": "Switch to headless mode with --continue, passing explicit context summaries between batch invocations to maintain continuity."}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 26, "scenario": "Code Generation with Claude Code", "stem": "You want to create a custom `/review` slash command that runs your team's standard code review checklist. This command should be available to every developer when they clone or pull the repository. Where should you create this command file?", "options": {"A": "In `~/.claude/commands/` in each developer's home directory", "B": "In the `.claude/commands/` directory in the project repository", "C": "In a `.claude/config.json` file with a `commands` array", "D": "In the `CLAUDE.md` file at the project root"}, "correct": "B", "explanation_correct": "Placing custom slash commands in the `.claude/commands/` directory within the project repository is correct because these files are version-controlled and automatically available to every developer who clones or pulls the repo. This is the designated location for project-scoped custom commands in Claude Code.", "study_area": "Code Generation with Claude Code — review Custom Slash Commands concepts in the exam study guide.", "distractors": {"D": "The `CLAUDE.md` file at the project root is used for project instructions, context, and conventions that guide Claude's behavior, not for defining custom slash commands. Command definitions require their own dedicated files in the appropriate commands directory."}, "clipped": false}, {"q": 27, "scenario": "Code Generation with Claude Code", "stem": "You've created a `/commit` skill in `.claude/skills/commit/SKILL.md` that your team uses. One developer wants to customize it for their personal workflow (different commit message format, additional checks) without affecting teammates. What should you recommend?", "options": {"A": "Create a personal version in `~/.claude/skills/` with a different name like `/my-commit`", "B": "Add username-based conditional logic to the project skill's frontmatter", "C": "Set `override: true` in the personal skill's frontmatter to take precedence over the project version", "D": "Create a personal version at `~/.claude/skills/commit/SKILL.md` with the same name"}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 28, "scenario": "Code Generation with Claude Code", "stem": "Your team has been using Claude Code for several months. Recently, three developers report that Claude correctly follows your \"always include comprehensive error handling\" guideline, but a fourth developer who just joined reports Claude isn't following this guideline. All four developers are working in the same repository and have the latest code pulled. What's the most likely cause and appropriate fix?", "options": {"A": "Claude Code builds per-user preference models over time through repeated interactions. The new developer needs to repeatedly specify the error handling requirement until Claude learns their preferences.", "B": "The new developer's ~/.claude/CLAUDE.md contains conflicting instructions that override the project settings. Have them remove the conflicting section from their user-level configuration.", "C": "Claude Code caches CLAUDE.md contents after first read. The original developers have cached versions while the new developer loaded after the file was modified. Have all developers clear their Claude Code cache.", "D": "The guideline exists in the original developers' ~/.claude/CLAUDE.md files (user-level) instead of the project's .claude/CLAUDE.md. Move the instruction to the project-level .claude/CLAUDE.md file so it applies to everyone on the team."}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 29, "scenario": "Code Generation with Claude Code", "stem": "Your CLAUDE.md has grown to over 400 lines containing coding standards, testing conventions, a detailed PR review checklist, deployment workflow instructions, and database migration procedures. You want Claude to always follow the coding standards and testing conventions, but only apply PR review, deployment, and migration guidance when you're actually performing those tasks. What's the most effective restructuring approach?", "options": {"A": "Keep universal standards in CLAUDE.md and create Skills for task-specific workflows (PR reviews, deployments, migrations) with trigger keywords", "B": "Move all guidance into separate Skills files organized by workflow type, keeping only a brief project description in CLAUDE.md", "C": "Keep all content in CLAUDE.md but use @import syntax to organize it into separately maintained files by category", "D": "Split the CLAUDE.md into files in .claude/rules/ with path-specific glob patterns so each rule loads only for matching file types"}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 30, "scenario": "Code Generation with Claude Code", "stem": "Your team created an `/analyze-codebase` skill that performs comprehensive code analysis—dependency scanning, test coverage calculation, and code quality metrics. After running this command, team members report that Claude becomes less responsive in the session and loses track of their original task. What’s the most effective way to address this while preserving full analysis capability?", "options": {"A": "Add `model: haiku` to the frontmatter to use a faster, more efficient model for the analysis", "B": "Add instructions to the skill to compress all outputs into a brief summary before displaying", "C": "Add `context: fork` to the skill’s frontmatter to run the analysis in an isolated sub-agent context", "D": "Split the skill into three smaller skills that each generate less output"}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 31, "scenario": "Claude Code for Continuous Integration", "stem": "Your automated reviews identify valid issues but developers report the feedback isn’t actionable. Findings say things like “complex ticket allocation logic” or “potential null pointer” without specifying what to change. When you add detailed instructions like “always include specific fix suggestions,” the model still produces inconsistent output—sometimes detailed, sometimes vague. What prompting technique would most reliably produce consistently actionable feedback?", "options": {"A": "Expand the context window to include more of the surrounding codebase so the model has sufficient information to suggest specific fixes", "B": "Add 3-4 few-shot examples showing the exact format you want: issue identified, code location, specific fix suggestion", "C": "Further refine the instructions with more explicit requirements for each part of the feedback format (location, issue, severity, suggested fix)", "D": "Implement a two-pass approach where one prompt identifies issues and a second prompt generates fixes, allowing specialization"}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 32, "scenario": "Claude Code for Continuous Integration", "stem": "Your automated code review system shows inconsistent severity ratings—similar issues like null pointer risks receive “critical” severity in some PRs but […] others. Developer trust is declining because teams can’t predict which findings require immediate attention. What’s the most effective way to improve […] consistency?", "options": {"A": "Modify the prompt to ask Claude to rate severity relative to other issues in the same PR, so the most severe issue is always marked critical and others […] proportionally", "B": "Add a CLAUDE.md file that lists issue types and their default severities, instructing Claude to reference this mapping when assigning ratings", "C": "Request that Claude include its reasoning for each severity assignment, then use that reasoning to manually calibrate and adjust ratings during review", "D": "Include explicit severity criteria in your prompt with concrete code examples for each severity level"}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": true}, {"q": 33, "scenario": "Claude Code for Continuous Integration", "stem": "Your pipeline script runs `claude \"Analyze this pull request for security issues\"` but the job hangs indefinitely. Logs indicate Claude Code is waiting for interactive input. What’s the correct approach to run Claude Code in an automated pipeline?", "options": {"A": "Add the `--batch` flag: `claude --batch \"Analyze this pull request for security issues\"`", "B": "Add the `-p` flag: `claude -p \"Analyze this pull request for security issues\"`", "C": "Set the environment variable `CLAUDE_HEADLESS=true` before running the command", "D": "Redirect stdin from /dev/null: `claude \"Analyze this pull request for security issues\" < /dev/null`"}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 34, "scenario": "Claude Code for Continuous Integration", "stem": "Your CI pipeline includes two Claude-powered code review modes: a `pre-merge-commit` hook that blocks PR merging until complete, and \"deep analysis\" that runs overnight, polls for batch completion, then posts detailed suggestions to the PR. You want to reduce API costs using the Message Batches API, which offers 50% savings but requires polling and may take up to 24 hours to complete. Which mode should use batch processing?", "options": {"A": "Pre-merge-commit hook only", "B": "Neither mode", "C": "Both modes", "D": "Deep analysis only"}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 35, "scenario": "Claude Code for Continuous Integration", "stem": "Your automated review analyzes comments and docstrings. The current prompt instructs Claude to \"check that comments are accurate and up-to-date.\" Findings frequently flag acceptable patterns (TODO markers, straightforward descriptions) while missing comments that describe behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?", "options": {"A": "Add few-shot examples of misleading comments to help the model recognize similar patterns in the codebase", "B": "Filter out TODO, FIXME, and descriptive comment patterns before analysis to reduce noise", "C": "Include git blame data so Claude can identify comments that predate recent code modifications", "D": "Specify explicit criteria: flag comments only when their claimed behavior contradicts actual code behavior"}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 36, "scenario": "Claude Code for Continuous Integration", "stem": "Your CI/CD system performs three types of Claude-powered analysis: (1) quick style checks on each PR that block merging until complete, (2) comprehensive security audits of the entire codebase run weekly, and (3) test case generation triggered nightly for recently-modified modules. The Message Batches API offers 50% cost savings but can take up to 24 hours to process. You want to optimize API costs while maintaining acceptable developer experience. Which combination correctly matches each task to its API approach?", "options": {"A": "Use synchronous calls for all three tasks for consistent response times, and rely on prompt caching to reduce costs across all workloads.", "B": "Use the Message Batches API for all three tasks to maximize the 50% cost savings, and configure the pipeline to poll for batch completion.", "C": "Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation.", "D": "Use synchronous calls for PR style checks and nightly test generation; use Message Batches API only for weekly security audits."}, "correct": "C", "explanation_correct": "This is the correct approach. PR style checks block developers and require immediate responses via synchronous calls, while weekly security audits and nightly test generation are scheduled tasks with flexible timelines that can easily tolerate the up-to-24-hour batch processing window, capturing the 50% cost savings on both.", "study_area": null, "distractors": {}, "clipped": false}, {"q": 37, "scenario": "Claude Code for Continuous Integration", "stem": "Your automated review generates test case suggestions for each PR. When reviewing a PR that adds course completion tracking, Claude suggests 10 test cases but developer feedback indicates 6 duplicate scenarios already covered in the existing test suite. What change would most effectively reduce duplicate suggestions?", "options": {"A": "Implement post-processing that filters suggestions whose descriptions match keywords from existing test names", "B": "Reduce requested suggestions from 10 to 5, assuming Claude will prioritize the most valuable cases first", "C": "Include the existing test file in the context so Claude can identify what scenarios are already covered", "D": "Add instructions directing Claude to focus exclusively on edge cases and error conditions rather than successful paths"}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 38, "scenario": "Claude Code for Continuous Integration", "stem": "Your team uses Claude Code to generate code suggestions, but you notice a pattern: subtle issues—performance optimizations that break edge cases, cleanups that change behavior unexpectedly—only surface when a different team member reviews the PR. Claude's reasoning during generation shows it considered these cases but concluded its approach was correct. Which approach directly addresses the root cause of this self-review limitation?", "options": {"A": "Include comprehensive test files and documentation in the prompt context so Claude better understands expected behavior during generation.", "B": "Add explicit self-review instructions to the generation prompt, asking Claude to critique its own suggestions before finalizing output.", "C": "Have a second, independent Claude Code instance review the changes without seeing the generator's reasoning.", "D": "Enable extended thinking mode for the generation pass, allowing more thorough deliberation before producing suggestions."}, "correct": "C", "explanation_correct": "Using a second, independent Claude Code instance without access to the generator's reasoning directly addresses the root cause by eliminating confirmation bias. This fresh perspective mirrors the benefit of human peer review, where a different team member catches issues the original author rationalized away.", "study_area": null, "distractors": {}, "clipped": false}, {"q": 39, "scenario": "Claude Code for Continuous Integration", "stem": "Your automated code review averages 15 findings per pull request, with developers reporting a 40% false positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude's reasoning before deciding whether to address or dismiss it. Your `CLAUDE.md` already contains comprehensive rules for acceptable patterns, and stakeholders have rejected any approach that filters findings before developer review. What change would best address the investigation time bottleneck?", "options": {"A": "Categorize findings as \"blocking issues\" versus \"suggestions\" with tiered review requirements", "B": "Add a post-processor that analyzes finding patterns and automatically suppresses those matching historical false positive signatures", "C": "Require Claude to include its reasoning and confidence assessment inline with each finding", "D": "Configure Claude to only surface findings it assesses as high confidence, filtering out uncertain flags before developers see them"}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 40, "scenario": "Claude Code for Continuous Integration", "stem": "Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings. How should you evaluate this proposal?", "options": {"A": "Switch both workflows to batch processing with status polling to check for completion.", "B": "Keep real-time calls for both workflows to avoid batch result ordering issues.", "C": "Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks.", "D": "Switch both to batch processing with a timeout fallback to real-time if batches take too long."}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 41, "scenario": "Claude Code for Continuous Integration", "stem": "A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback—flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR. How should you restructure the review?", "options": {"A": "Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow.", "B": "Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs.", "C": "Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass.", "D": "Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs."}, "correct": "A", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 42, "scenario": "Claude Code for Continuous Integration", "stem": "Analysis of your automated code review shows significant variation in false positive rates across finding categories. Security and correctness findings have an 8% false positive rate, performance findings have 18%, style and naming findings have 52%, and documentation findings have 48%. Developer surveys indicate growing distrust—many have started dismissing findings without review because \"half are wrong.\" The high false positive categories are undermining confidence in the accurate categories. What approach best restores developer trust while improving the system?", "options": {"A": "Temporarily disable high false positive categories (style, naming, documentation) and run only high-precision categories while improving prompts.", "B": "Keep all categories but display a confidence score with each finding, letting developers decide which to investigate.", "C": "Keep all categories enabled while adding few-shot examples to improve each category's accuracy over the coming weeks.", "D": "Apply a uniform strictness reduction across all categories to bring the overall false positive rate to an acceptable level."}, "correct": "A", "explanation_correct": "Temporarily disabling the high false positive categories (style, naming, documentation) immediately stops trust erosion by removing the noise that causes developers to dismiss all findings, while preserving the value of high-precision categories like security and correctness. This allows time to improve prompts for the problematic categories before re-enabling them, rebuilding trust through demonstrated accuracy.", "study_area": "Claude Code for Continuous Integration — review False Positive Reduction concepts in the exam study guide.", "distractors": {"C": "While improving prompts with few-shot examples addresses the root cause, keeping all categories enabled during the weeks-long improvement process allows trust to continue eroding as developers keep encountering the ~50% false positive rates that have already caused them to dismiss findings without review."}, "clipped": false}, {"q": 43, "scenario": "Claude Code for Continuous Integration", "stem": "Your CI pipeline runs the Claude Code CLI (with `--print` mode) using CLAUDE.md to provide project context for code reviews, and developers generally find the reviews insightful. However, they report that integrating findings into your workflow is difficult—Claude produces narrative paragraphs that must be manually copied into PR comments. Your team wants to automatically post each finding as a separate inline PR comment at the relevant code location, which requires structured data with file path, line number, severity, and suggested fix. What's the most effective approach?", "options": {"A": "Include explicit formatting instructions in your review prompt requiring each finding to follow a parseable template like `[FILE:path] [LINE:n] [SEVERITY:level] ...`.", "B": "Add a \"Review Output Format\" section to CLAUDE.md with examples showing structured findings, so Claude learns the expected format from project context.", "C": "Keep the narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of the findings.", "D": "Use CLI flags `--output-format json` and `--json-schema` to enforce structured findings, then parse output to post inline comments via the GitHub API."}, "correct": "D", "explanation_correct": "Using `--output-format json` with `--json-schema` enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, […]", "study_area": null, "distractors": {}, "clipped": false}, {"q": 44, "scenario": "Claude Code for Continuous Integration", "stem": "After an initial automated review generates 12 findings, a developer pushes new commits to address the issues. When the review runs again, it produces findings, but developers report that 5 duplicate earlier comments on code that was already fixed in the new commits. What's the most effective way to eliminate redundant feedback while maintaining thorough analysis?", "options": {"A": "Include prior review findings in context, instructing Claude to only report new or still-unaddressed issues.", "B": "Add a post-processing filter that removes findings matching previous file paths and issue descriptions before posting comments.", "C": "Restrict the review scope to only files modified in the most recent push, excluding files from earlier commits.", "D": "Run reviews only on initial PR creation and final pre-merge state, skipping intermediate commits."}, "correct": "A", "explanation_correct": "Including prior review findings in context allows Claude to intelligently distinguish between new issues and those already addressed by re[…] maintains thorough analysis while leveraging Claude's reasoning ability to avoid redundant feedback on fixed code.", "study_area": "Claude Code for Continuous Integration — review CI/CD Integration concepts in the exam study guide.", "distractors": {}, "clipped": false}, {"q": 45, "scenario": "Claude Code for Continuous Integration", "stem": "The code review component works iteratively: Claude analyzes a changed file, then may request related files (imports, base classes, etc.) for additional context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude invokes this tool iteratively during analysis. You're evaluating batch processing to reduce API costs. What is the primary technical constraint when considering batch processing for this workflow?", "options": {"A": "The batch API doesn't support tool definitions in request parameters.", "B": "Batch processing latency of up to 24 hours is too slow for pull request feedback, though the workflow could otherwise function.", "C": "The asynchronous model prevents executing tools mid-request and returning results for Claude to continue analysis.", "D": "Batch processing lacks request correlation identifiers for matching outputs to input requests."}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 46, "scenario": "Multi-Agent Research System", "stem": "The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent. Which error propagation approach best enables intelligent recovery?", "options": {"A": "Catch the timeout within the subagent and return an empty result set marked as successful.", "B": "Implement automatic retry logic with exponential backoff within the subagent, returning a generic “search unavailable” status only after all retries are exhausted.", "C": "Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow.", "D": "Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches."}, "correct": "D", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 47, "scenario": "Multi-Agent Research System", "stem": "After running the system on the topic “impact of AI on creative industries,” you observe that each subagent completes successfully: the web search agent finds relevant articles, the document analysis agent summarizes papers correctly, and the synthesis agent produces coherent output. However, the final reports cover only visual arts, completely missing music, writing, and film production. When you examine the coordinator's logs, you see it decomposed the topic into three subtasks: “AI in digital art creation,” “AI in graphic design,” and “AI in photography.” What is the most likely root cause?", "options": {"A": "The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents.", "B": "The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic.", "C": "The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria.", "D": "The web search agent's queries are not comprehensive enough and need to be expanded to cover more creative industry sectors."}, "correct": "B", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 48, "scenario": "Multi-Agent Research System", "stem": "A colleague suggests having the document analysis agent send its output directly to the synthesis agent instead of routing through the coordinator. What’s the advantage of keeping the coordinator as the central hub for all subagent communication?", "options": {"A": "The coordinator batches multiple subagent requests together, reducing the total number of API calls and overall latency", "B": "Subagents operate with isolated memory, and direct communication would require complex serialization that only the coordinator can perform", "C": "The coordinator can observe all interactions, handle errors consistently, and decide what information each subagent should receive", "D": "Routing through the coordinator enables automatic retry logic that direct agent-to-agent calls cannot support"}, "correct": "C", "explanation_correct": null, "study_area": null, "distractors": {}, "clipped": false}, {"q": 49, "scenario": "Multi-Agent Research System", "stem": "The web search subagent returns results for only 3 of 5 requested source categories (competitor websites and industry reports succeeded, but news archives and social media feeds timed out). The document analysis subagent successfully processed all provided documents. The synthesis subagent must now produce a findings summary from this mixed-quality input. What’s the most effective error propagation strategy?", "options": {"A": "Structure the synthesis output with coverage annotations indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources.", "B": "Have the synthesis subagent request the coordinator retry the timed-out sources with extended timeouts before proceeding, ensuring complete data coverage before synthesis begins.", "C": "Proceed with synthesis using only the successful sources, generating output without indicating which data was unavailable.", "D": "Have the synthesis subagent return an error to the coordinator indicating incomplete upstream data, triggering a full retry or task failure."}, "correct": "A", "explanation_correct": "Structuring the synthesis output with coverage annotations embodies graceful degradation with transparency, allowing downstream consumers and end users to understand […]", "study_area": null, "distractors": {}, "clipped": false}, {"q": 50, "scenario": "Multi-Agent Research System", "stem": "During testing, combined outputs from the web search agent (85K tokens including page content) and the document analysis agent (70K tokens including reasoning chains) total 155K tokens, but the synthesis agent performs optimally with inputs under 50K tokens. What’s the most effective solution?", "options": {"A": "Store findings in a vector database and give the synthesis agent retrieval tools to query during its work", "B": "Add an intermediate summarization agent that condenses findings before passing to synthesis", "C": "Modify upstream agents to return structured data (key facts, citations, relevance scores) instead of verbose content and reasoning", "D": "Have the synthesis agent process findings in sequential batches, maintaining running state between calls"}, "correct": "C", "explanation_correct": "Modifying upstream agents to return structured data (key facts, citations, relevance scores) addresses the root cause by reducing token volume at the source while preserving essential information. This eliminates verbose page content and reasoning chains that inflate token counts without adding value for the synthesis step.", "study_area": "Multi-Agent Research System — review Multi-Agent Orchestration concepts in the exam study guide.", "distractors": {"B": "Adding an intermediate summarization agent introduces additional latency, cost, and risk of information loss, while the summarization agent itself must still process the full 155K tokens. This treats the symptom rather than the root cause of upstream agents producing unnecessarily verbose output."}, "clipped": false}, {"q": 51, "scenario": "Multi-Agent Research System", "stem": "The document analysis agent discovers that two credible sources contain directly conflicting statistics on a key metric: one government report states 40% growth while an industry analysis states 12% growth. Both sources appear legitimate and the discrepancy could significantly affect the research conclusions. What’s the most effective way for the document analysis agent to handle this?", "options": {"A": "Halt analysis and escalate to the coordinator immediately, asking it to determine which source is authoritative before the agent continues processing remaining documents.", "B": "Apply source credibility heuristics to select the most likely accurate figure, complete the analysis using that value, and include a footnote mentioning the discrepancy.", "C": "Complete the document analysis with both f
